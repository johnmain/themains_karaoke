{{ define "main" }}
<div class="container mx-auto px-4 py-12 max-w-4xl">
    <div class="text-center mb-12">
        <h1 class="text-5xl font-extrabold mb-6 tracking-tight">{{ .Title }}</h1>
        <div class="text-xl text-neutral-600 dark:text-neutral-300">
            {{ .Content }}
        </div>
    </div>

    <div class="bg-white dark:bg-neutral-900 p-6 rounded-2xl shadow-sm border border-neutral-200 dark:border-neutral-800 mb-8">
        <div class="flex flex-col sm:flex-row gap-4">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search by artist or song title..." 
                class="flex-1 px-4 py-3 rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
            >
            <button 
                id="searchButton"
                class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-semibold transition-colors whitespace-nowrap"
            >
                Search
            </button>
        </div>
    </div>

    <div id="searchResults" class="bg-white dark:bg-neutral-900 rounded-2xl shadow-sm border border-neutral-200 dark:border-neutral-800 overflow-hidden empty:hidden">
        <!-- Results will be injected here -->
    </div>
</div>

{{ partial "search-scripts.html" . }}
{{ end }}
