{{ $dataType := .Get 0 | default "karaoke" }}

<div class="search-container">
    <div class="flex flex-col sm:flex-row gap-3 mt-4 mb-6">
        <input
            type="text"
            id="searchInput"
            placeholder="{{ if eq $dataType "karaoke" }}Search by song title or artist...{{ else }}Search by artist or song title...{{ end }}"
            class="flex-1 px-4 py-3 rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
        >
        <button
            id="searchButton"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold transition-colors whitespace-nowrap"
        >
            Search
        </button>
    </div>
    <div id="searchResults" class="results-card"></div>
</div>

{{ partial "search-scripts.html" . }}
