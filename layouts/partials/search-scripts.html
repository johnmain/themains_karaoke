<!-- Load Fuse.js BEFORE any script that uses it -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>

<script>
async function loadSongs() {
  const res = await fetch('/karaoke_clean.json');
  const songs = await res.json();

  // Fuse is now definitely defined here
  const fuse = new Fuse(songs, {
    keys: ['Artist', 'Title'],
    threshold: 0.3
  });

  const input = document.getElementById('searchInput');
  const button = document.getElementById('searchButton');
  const resultsEl = document.getElementById('searchResults');

  function runSearch() {
    const query = input.value.trim();

    if (!query) {
      resultsEl.innerHTML = '';
      return;
    }

    const results = fuse.search(query);

    resultsEl.innerHTML = results
      .map(r => {
        const s = r.item;
        return `
          <div class="search-result-item">
            <strong class="text-lg font-bold text-white">${s.Artist}</strong><br>
            <span class="text-gray-300">${s.Title}</span>
          </div>
        `;
      })
      .join('');
  }

  // Click → search
  button.addEventListener('click', runSearch);

  // Enter key → search
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      runSearch();
    }
  });
}

document.addEventListener('DOMContentLoaded', loadSongs);
</script>
